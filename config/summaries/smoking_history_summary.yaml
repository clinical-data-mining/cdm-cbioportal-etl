column_metadata:
  smoking_status:
    label: Smoking Status (NLP)
    datatype: STRING
    comment: 'Smoking status (Current, Former, Never, Unknown) from structured Epic/IDB data; Unknowns backfilled by 
    LLM from medical oncology notes. May remain Unknown if the note lacks a smoking section 
    (mostly notes before 2015). ---SOURCE: IDB, backfilled by NLP from medical oncology notes.'
    fill_value: Unknown
  pack_years:
    label: Pack Years (NLP)
    datatype: NUMBER
    comment: 'Number of pack years the patient smoked documented in early clinical note. Pack years is defined by the total number of years the patient smoked multiplied by the packs per day. (Note: the upper bound of any documented range was taken for pack years or packs per day where relevant) --SOURCE: NLP generated from medical oncology notes.'
    fill_value: NA
  years_smoked:
    label: Smoking Duration (NLP)
    datatype: NUMBER
    comment: 'Number of years the patient smoked mentioned in early clinical note. (Note: the upper bound of any documented range was taken for pack years or packs per day where relevant) --SOURCE:NLP generated from medical oncology notes.'
    fill_value: NA
  packs_per_day:
    label: Packs Per Day (NLP)
    datatype: NUMBER
    comment: 'Number of packs per day the patient smoked mentioned in early clinical note. (Note: the upper bound of any documented range was taken for pack years or packs per day where relevant). 
    --SOURCE:NLP generated from medical oncology notes.'
    fill_value: NA
