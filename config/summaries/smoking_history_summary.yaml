- packs_per_day
- years_smoked
- pack_years
date_columns: []
dest_prod:
  catalog: cdsi_eng_phi
  schema: cdm_eng_cbioportal_etl
  volume_name: cdm_eng_cbioportal_etl_volume
  filename: smoking_history_summary_patient.tsv
dest_dev:
  catalog: cdsi_eng_phi
