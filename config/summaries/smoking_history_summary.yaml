summary_id: smoking_history_summary_patient
patient_or_sample: patient
source_table_prod: cdsi_eng_phi.cdm_eng_smoking_history.mart_smoking_pack_year_patient
source_table_dev: cdsi_eng_phi.cdm_eng_smoking_history.mart_smoking_pack_year_patient
